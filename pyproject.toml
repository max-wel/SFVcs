[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sfvcs"
version = "0.1"
description = "A version control CLI tool"
requires-python = ">=3.10"

dependencies = [
    "arguably",
    "bsdiff4",
    "rich",
]

[project.scripts]
sfvcs = "sfvcs.main:main"

[tool.setuptools.packages.find]
where = ["src"]
